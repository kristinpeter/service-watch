[project]
name = "service-watch"
version = "0.1.0"
description = "Health-check monitor with Webex alerting, deployed to OpenShift via Shipwright."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kristin Peter" }]
requires-python = ">=3.11"
keywords = ["monitoring", "openshift", "webex", "freeipa", "alerting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
service-watch = "service_watch.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_watch"]

[tool.ruff]
line-length = 100
target-version = "py311"
