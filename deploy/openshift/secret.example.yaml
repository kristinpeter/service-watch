# SECRET TEMPLATE — do NOT commit real values.
# Create the real secret with:
#
#   oc create secret generic service-watch-webex \
#     --namespace infra-watch \
#     --from-literal=WEBEX_BOT_TOKEN='<your bot token>' \
#     --from-literal=WEBEX_SPACE_ID='<your space id>'
#
# Or apply this file after filling in base64-encoded values:
#   echo -n 'your-token' | base64

apiVersion: v1
kind: Secret
metadata:
  name: service-watch-webex
  namespace: infra-watch
type: Opaque
data:
  WEBEX_BOT_TOKEN: REPLACE_WITH_BASE64_TOKEN
  WEBEX_SPACE_ID: REPLACE_WITH_BASE64_SPACE_ID
